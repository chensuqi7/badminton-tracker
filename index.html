<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>羽球课时账本</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f3f8;color:#242137;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:540px;margin:auto;padding:24px 16px 40px}h1{font-size:24px;margin:0 0 5px}p{line-height:1.6}small,.muted{color:#706b80;font-size:13px}.hero{background:#59478f;color:white;border-radius:22px;padding:24px;margin:20px 0}.hero small{color:#e5def6}.number{font-size:64px;font-weight:700;line-height:1.3}.stats{display:flex;justify-content:space-between;border-top:1px solid #ffffff44;padding-top:14px}.card{background:white;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 3px 14px #29204109}h2{font-size:17px;margin:0 0 14px}button,input,select{font:inherit;border-radius:10px;padding:12px;border:1px solid #dedbe6;min-width:0}button{cursor:pointer;background:#f2eff9;color:#59478f;font-weight:600}button.primary{background:#59478f;color:white;border:none;width:100%;padding:15px}button:active{opacity:.7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:13px;color:#706b80;margin:10px 0 5px}input,select{width:100%;background:white;color:#242137}.line{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #eee}.line:last-child{border:0}.grow{flex:1;min-width:0;overflow-wrap:anywhere}.delta{font-weight:700;white-space:nowrap}.del{font-size:12px;padding:7px;background:white;color:#8b6570}.warn{color:#ffe3a1;font-size:14px;margin:8px 0}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools button{font-size:13px}.error{color:#a32626}details summary{cursor:pointer;font-weight:600}#status{font-size:13px;color:#59478f;min-height:20px} .hidden{display:none}
main{padding:calc(24px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}button,input,select{min-height:44px}summary{min-height:44px;line-height:44px}.presets[hidden]{display:none}.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
</style><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#59478f"></head><body><main><h1>羽球课时账本</h1><div class="muted">每一次训练，都有记录。</div><section class="hero"><small>当前剩余课时</small><div class="number"><span id="balance">22</span><span style="font-size:22px"> 节</span></div><div id="warning" class="warn" aria-live="polite"></div><div class="stats"><div><small>累计新购</small><br><strong id="bought">0</strong> 节</div><div><small>累计消课</small><br><strong id="used">0</strong> 节</div><div><small>起始余额</small><br><strong>22</strong> 节</div></div></section>
<section class="card"><h2>快速记课</h2><form id="entry"><label for="date">上课日期</label><input id="date" type="date" required><label for="kind">类型</label><select id="kind"><option value="lesson">正常上课</option><option value="makeup">补课</option><option value="gift">赠送课（不扣课时）</option></select><label for="qty">实际扣除课时（不扣填 0）</label><div class="presets" id="presets"><button type="button" data-qty="0.5">0.5</button><button type="button" data-qty="1">1</button><button type="button" data-qty="1.5">1.5</button><button type="button" data-qty="2">2</button></div><input id="qty" type="number" min="0" max="100" step="0.01" value="1" required><label for="note">备注（选填）</label><input id="note" maxlength="200" placeholder="例如：步法、后场高远球"><p><button class="primary" type="submit">确认记课</button></p></form><div id="status" role="status"></div></section>
<section class="card"><details><summary>续购课时 / 增加课时</summary><form id="purchase"><label for="pdate">购课日期</label><input id="pdate" type="date" required><div class="grid"><div><label for="pqty">新增课时</label><input id="pqty" type="number" min="0.01" max="10000" step="0.01" required></div><div><label for="money">实付金额（元，选填）</label><input id="money" type="number" min="0" step="0.01"></div></div><label for="pnote">备注（选填）</label><input id="pnote" maxlength="200"><p><button class="primary">确认新增课时</button></p></form></details></section>
<section class="card"><h2>历史流水 <small id="recordCount"></small></h2><label for="filter">搜索日期、类型或备注</label><input id="filter" type="search"><div id="history"></div></section><section class="card"><h2>数据备份</h2><div class="tools"><button id="export">导出备份</button><button id="csv">导出 Excel 可读 CSV</button><button id="import">恢复备份</button></div><input id="file" type="file" accept=".json,application/json" class="hidden"><p class="muted">记录仅保存在当前浏览器，不会自动跨设备同步。请定期导出 JSON 备份；恢复备份会替换当前记录。隐私模式、清理浏览器数据或某些本地文件预览器可能无法长期保存。</p><div id="storage" class="error" role="alert"></div></section></main><script>
'use strict';const $=id=>document.getElementById(id), KEY='zy-personal-lessons-v1';let records=[];let storageOK=true;function valid(a){return Array.isArray(a)&&a.every(r=>r&&typeof r.id==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(r.date)&&['lesson','makeup','gift','purchase'].includes(r.kind)&&Number.isFinite(r.qty)&&r.qty>=0&&Math.abs(Math.round(r.qty*100)-r.qty*100)<1e-7&&(r.kind!=='purchase'||r.qty>0)&&(r.kind!=='gift'||r.qty===0)&&typeof r.note==='string'&&(r.money===null||(Number.isFinite(r.money)&&r.money>=0)))&&new Set(a.map(r=>r.id)).size===a.length}try{let v=localStorage.getItem(KEY);if(v){let a=JSON.parse(v);if(!valid(a))throw Error();records=a}}catch(e){storageOK=false;$('storage').textContent='无法读取本地账本。当前记录受保护，请检查浏览器存储或从已有备份恢复。'}
function today(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`} $('date').value=$('pdate').value=today();const names={lesson:'正常上课',makeup:'补课',gift:'赠送课',purchase:'续购 / 新增'};function sums(){let b=0,u=0;for(const r of records){if(r.kind==='purchase')b+=Math.round(r.qty*100);else u+=Math.round(r.qty*100)}return {b:b/100,u:u/100,bal:(2200+b-u)/100}}
function save(next,restore=false){
  if(!storageOK&&!restore)return false;
  try{
    localStorage.setItem(KEY,JSON.stringify(next));
  }catch(e){
    $('storage').textContent='保存失败，当前账本未修改。请检查浏览器存储后重试。';
    return false;
  }
  records=next;
  storageOK=true;
  $('storage').textContent='';
  render();
  return true;
}
function el(tag,txt,cls){let n=document.createElement(tag);n.textContent=txt;if(cls)n.className=cls;return n}function render(){let {b,u,bal}=sums();$('balance').textContent=bal;$('bought').textContent=b;$('used').textContent=u;$('warning').textContent=bal<0?'已超课 '+(-bal)+' 节，请核对并续费。':bal===0?'课时已用完，请先核对续费。':bal<=1?'剩余 1 节以内，请尽快续费。':bal<=3?'剩余不足或等于 3 节，请与教练核对。':bal<=5?'剩余不多，注意续费。':'';$('recordCount').textContent=records.length+' 条';let h=$('history');h.replaceChildren();if(!records.length)h.append(el('p','还没有新记录，历史超课已计入起始余额。','muted'));const query=$('filter').value.trim().toLowerCase();const matches=records.filter(r=>[r.date,names[r.kind],r.note].some(v=>v.toLowerCase().includes(query)));if(records.length&&!matches.length)h.append(el('p','没有匹配的流水。','muted'));matches.reverse().sort((a,b)=>b.date.localeCompare(a.date)).forEach(r=>{let row=el('div','','line'),g=el('div','','grow');g.append(el('strong',names[r.kind]),el('div',r.date+(r.note?' · '+r.note:'')+(r.money!==null?' · ¥'+r.money:''),'muted'));let del=el('button','撤销','del');del.onclick=()=>{if(confirm('撤销此条流水并重新计算余额？')){if(save(records.filter(x=>x.id!==r.id)))$('status').textContent='已撤销流水'}};row.append(g,el('span',(r.kind==='purchase'?'+':r.qty?'-':'')+r.qty+' 节','delta'),del);h.append(row)})}function add(r){r.id=Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);if(!save([...records,r]))return false;$('status').textContent='已登记并保存 · 剩余 '+sums().bal+' 节';return true}$('filter').oninput=render;for(const button of $('presets').querySelectorAll('button'))button.onclick=()=>{$('qty').value=button.dataset.qty};$('kind').onchange=()=>{$('qty').value=$('kind').value==='gift'||$('kind').value==='makeup'?'0':'1';$('qty').readOnly=$('presets').hidden=$('kind').value==='gift'};$('entry').onsubmit=e=>{e.preventDefault();let q=Number($('qty').value),kind=$('kind').value,date=$('date').value;if(kind==='lesson'&&q===0&&!confirm('本次正常上课不扣课时，是否确认？'))return;if(q>sums().bal&&q>0&&!confirm('本次登记将导致超课，仍要记录实际发生的课程吗？'))return;if(records.some(r=>r.date===date&&r.kind===kind&&r.qty===q)&&!confirm('当天已有相同类型和课时的记录，确定不是重复登记？'))return;if(add({date,kind,qty:q,note:$('note').value,money:null}))$('note').value=''};$('purchase').onsubmit=e=>{e.preventDefault();const date=$('pdate').value,qty=Number($('pqty').value),money=$('money').value===''?null:Number($('money').value);if(records.some(r=>r.kind==='purchase'&&r.date===date&&r.qty===qty&&r.money===money)&&!confirm('当天已有相同课时和金额的购课记录，仍要登记吗？'))return;if(!add({date,kind:'purchase',qty,money,note:$('pnote').value}))return;$('purchase').reset();$('pdate').value=today()};function dl(name,content,type){let u=URL.createObjectURL(new Blob([content],{type}));let a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}$('export').onclick=()=>dl('羽球课时备份-'+today()+'.json',JSON.stringify({version:1,initial:22,records},null,2),'application/json');$('csv').onclick=()=>{let esc=v=>'"'+String(v??'').replace(/^[\s\uFEFF]*[=+@-]|^[\t\r\n]/,"'$&").replace(/"/g,'""')+'"';let lines=[['日期','类型','新增课时','扣除课时','金额','备注'],['','起始余额',22,0,'','已抵消历史超课'],...records.map(r=>[r.date,names[r.kind],r.kind==='purchase'?r.qty:0,r.kind==='purchase'?0:r.qty,r.money,r.note])];dl('羽球课时流水-'+today()+'.csv','\ufeff'+lines.map(r=>r.map(esc).join(',')).join('\r\n'),'text/csv;charset=utf-8')};$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{try{let f=$('file').files[0];if(!f)return;let a=JSON.parse(await f.text());if(a.version!==1||a.initial!==22||!valid(a.records))throw Error();if(confirm('恢复 '+a.records.length+' 条记录并替换当前账本？')){save(a.records,true)}}catch(e){alert('备份格式不正确，未修改现有记录。')}finally{$('file').value=''}};render();</script><script>if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(console.warn);</script></body></html>
